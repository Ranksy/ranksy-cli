[package]
name = "ranksy-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ranksy"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
directories = "5"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
tabled = "0.16"
serde_json = "1"
is-terminal = "0.4"
