name: release-please

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Trigger cargo-dist release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          # Must be a PAT or GitHub App token, NOT GITHUB_TOKEN. GitHub blocks
          # events authored by the default GITHUB_TOKEN from triggering other
          # workflows (anti-recursion), so a dispatch made with it silently
          # no-ops and release.yml never builds. A PAT makes the dispatch fire.
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: gh workflow run release.yml -f tag="${{ steps.release.outputs.tag_name }}"
